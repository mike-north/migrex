name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build type declarations for core first
        run: cd packages/core && pnpm build:types

      - name: Update API surface for core first
        run: cd packages/core && pnpm generate:api-report

      - name: Build type declarations for all
        run: pnpm build:types

      - name: Update API surface for all
        run: pnpm generate:api-reports

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:run

      - name: Check for unused dependencies
        run: pnpm knip

      - name: Check dependency versions
        run: pnpm syncpack:check

      - name: Check API surface
        run: pnpm check:api-reports
